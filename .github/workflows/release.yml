# Fires when a GitHub release is created: builds the Swift app + Go server on
# a macOS runner, signs both with the Developer ID identity (hardened
# runtime + timestamp), notarizes via notarytool, staples the ticket, and
# uploads the .dmg to the release.
#
# Required repository secrets:
#   DEVELOPER_ID_P12           base64 of the Developer ID Application .p12
#                              (security export -t identities -f pkcs12 | base64)
#   DEVELOPER_ID_P12_PASSWORD  password that protects that .p12
#   NOTARY_API_KEY_P8          base64 of the App Store Connect API .p8
#   NOTARY_KEY_ID              e.g. T6QVMMTDNZ
#   NOTARY_ISSUER_ID           e.g. cd34d498-1909-4e88-80c6-e495eaaf5eb7
name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-notarize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PW=$(openssl rand -hex 16)
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"
          echo "$P12" | base64 -D > cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import cert.p12 -k build.keychain -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" build.keychain
          rm -f cert.p12
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Build, sign, notarize
        env:
          SIGN_IDENTITY: "Developer ID Application: Christian Hackl (X8DS49XT5H)"
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "${{ secrets.NOTARY_API_KEY_P8 }}" | base64 -D > notary.p8
          chmod 600 notary.p8
          NOTARY_KEY_PATH="$PWD/notary.p8" ./release.sh
          rm -f notary.p8

      - name: Attach the dmg to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
